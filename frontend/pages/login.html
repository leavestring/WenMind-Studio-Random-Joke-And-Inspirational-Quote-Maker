<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - WenMind Studio</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 登录页专属样式 */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #FFF5F0 0%, #FFE8E0 50%, #FFF0F5 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .auth-card {
            padding: 36px 32px;
        }

        .auth-card .form-group:last-child {
            margin-bottom: 0;
        }

        .auth-card .btn {
            width: 100%;
            margin-top: 8px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            font-weight: 500;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 4px;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- 页面头部 -->
            <div class="auth-header">
                <span class="auth-logo">🧠</span>
                <h1>WenMind Studio</h1>
                <p>登录以获取每日份的快乐与温暖</p>
            </div>

            <!-- 登录表单 -->
            <div class="glass-card auth-card">
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            placeholder="请输入用户名"
                            required
                            autocomplete="username"
                        >
                        <div class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-toggle">
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="请输入密码"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="toggle-btn" id="togglePassword" title="显示/隐藏密码">
                                👁
                            </button>
                        </div>
                        <div class="form-error"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                        <span id="loginBtnText">登 录</span>
                        <div class="spinner" id="loginSpinner" style="display:none;"></div>
                    </button>
                </form>

                <div class="auth-divider">还没有账号？</div>

                <button class="btn btn-secondary btn-lg" onclick="location.href='register.html'">
                    注册新账号
                </button>
            </div>

            <div class="auth-footer">
                <a href="../../README.md">关于 WenMind Studio</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // ============================================================
        // 密码显隐切换
        // ============================================================
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleBtn.textContent = isHidden ? '🙈' : '👁';
        });

        // ============================================================
        // 登录表单提交
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // 表单验证
            if (!username) {
                showToast('请输入用户名', 'error');
                return;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                return;
            }

            // 显示加载状态
            loginBtn.disabled = true;
            loginBtnText.textContent = '登录中...';
            loginSpinner.style.display = 'inline-block';

            try {
                await userApi.login(username, password);
                showToast('登录成功！🎉', 'success');
                // 延迟跳转，让用户看到成功提示
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            } catch (error) {
                showToast(error.message, 'error');
                loginBtn.disabled = false;
                loginBtnText.textContent = '登 录';
                loginSpinner.style.display = 'none';
            }
        });

        // ============================================================
        // 如果已登录，直接跳转到主页
        // ============================================================
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
