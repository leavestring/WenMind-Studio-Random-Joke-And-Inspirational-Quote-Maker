<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - WenMind Studio</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 注册页样式 - 复用登录页布局 */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #FFF5F0 0%, #FFE8E0 50%, #FFF0F5 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .auth-card {
            padding: 36px 32px;
        }

        .auth-card .btn {
            width: 100%;
            margin-top: 8px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            font-weight: 500;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }

        .password-strength {
            margin-top: 6px;
            display: flex;
            gap: 4px;
        }

        .password-strength .bar {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #E5E7EB;
            transition: all 0.3s;
        }

        .password-strength .bar.active.weak {
            background: var(--error);
        }

        .password-strength .bar.active.medium {
            background: var(--accent);
        }

        .password-strength .bar.active.strong {
            background: var(--success);
        }

        .password-strength-text {
            font-size: 0.75rem;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- 页面头部 -->
            <div class="auth-header">
                <span class="auth-logo">🧠</span>
                <h1>加入 WenMind Studio</h1>
                <p>注册账号，开启每日快乐与温暖之旅</p>
            </div>

            <!-- 注册表单 -->
            <div class="glass-card auth-card">
                <form id="registerForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            placeholder="2-50个字符，支持中文、字母、数字、下划线"
                            required
                            autocomplete="username"
                            minlength="2"
                            maxlength="50"
                        >
                        <div class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-toggle">
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="至少6个字符"
                                required
                                autocomplete="new-password"
                                minlength="6"
                                maxlength="50"
                            >
                            <button type="button" class="toggle-btn" id="togglePassword" title="显示/隐藏密码">
                                👁
                            </button>
                        </div>
                        <!-- 密码强度指示器 -->
                        <div class="password-strength" id="passwordStrength">
                            <div class="bar" data-index="0"></div>
                            <div class="bar" data-index="1"></div>
                            <div class="bar" data-index="2"></div>
                            <div class="bar" data-index="3"></div>
                        </div>
                        <div class="password-strength-text" id="strengthText"></div>
                        <div class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="再次输入密码"
                            required
                            autocomplete="new-password"
                        >
                        <div class="form-error"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="registerBtn">
                        <span id="registerBtnText">注 册</span>
                        <div class="spinner" id="registerSpinner" style="display:none;"></div>
                    </button>
                </form>

                <div class="auth-divider">已有账号？</div>

                <button class="btn btn-secondary btn-lg" onclick="location.href='login.html'">
                    返回登录
                </button>
            </div>

            <div class="auth-footer">
                <a href="../../README.md">关于 WenMind Studio</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // ============================================================
        // 密码显隐切换
        // ============================================================
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleBtn.textContent = isHidden ? '🙈' : '👁';
        });

        // ============================================================
        // 密码强度检测
        // ============================================================
        const strengthBars = document.querySelectorAll('#passwordStrength .bar');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let strength = 0;

            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
            if (/\d/.test(val) && /[^a-zA-Z0-9]/.test(val)) strength++;

            // 重置
            strengthBars.forEach(bar => {
                bar.className = 'bar';
            });

            if (val.length === 0) {
                strengthText.textContent = '';
                return;
            }

            const labels = ['', '弱 - 建议增加长度', '中等', '强', '非常强'];
            const classes = ['', 'weak', 'medium', 'strong', 'strong'];

            strengthText.textContent = labels[strength] || '';

            for (let i = 0; i < strength; i++) {
                if (i < 4) {
                    strengthBars[i].classList.add('active', classes[strength] || 'weak');
                }
            }
        });

        // ============================================================
        // 注册表单提交
        // ============================================================
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const registerBtnText = document.getElementById('registerBtnText');
        const registerSpinner = document.getElementById('registerSpinner');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 表单验证
            if (!username) {
                showToast('请输入用户名', 'error');
                return;
            }
            if (username.length < 2) {
                showToast('用户名至少2个字符', 'error');
                return;
            }
            if (!/^[\u4e00-\u9fa5a-zA-Z0-9_]+$/.test(username)) {
                showToast('用户名只能包含中文、字母、数字和下划线', 'error');
                return;
            }
            if (!password || password.length < 6) {
                showToast('密码至少6个字符', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            // 显示加载状态
            registerBtn.disabled = true;
            registerBtnText.textContent = '注册中...';
            registerSpinner.style.display = 'inline-block';

            try {
                await userApi.register(username, password, confirmPassword);
                showToast('注册成功！🎉 正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } catch (error) {
                showToast(error.message, 'error');
                registerBtn.disabled = false;
                registerBtnText.textContent = '注 册';
                registerSpinner.style.display = 'none';
            }
        });

        // ============================================================
        // 如果已登录，直接跳转到主页
        // ============================================================
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
